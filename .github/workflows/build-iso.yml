name: build-iso
# Builds installer ISOs for both Forge OS images.
# Run it by hand: Actions tab, "build-iso", "Run workflow".
# Each ISO appears as a downloadable artifact at the bottom of the finished run.
on:
  workflow_dispatch:
    inputs:
      fedora_version:
        description: "Fedora version of the image (check the image tags if unsure)"
        default: "45"
        required: true

jobs:
  iso:
    name: ISO (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - forge-os            # NVIDIA
          - forge-os-universal  # AMD, Intel, virtual machines
    steps:
      - name: Free disk space (ISOs are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Build ISO
        id: build
        uses: jasonn3/build-container-installer@main
        with:
          arch: x86_64
          image_repo: ghcr.io/monkey7770   # must be lowercase
          image_name: ${{ matrix.image }}
          image_tag: latest
          image_signed: false
          version: ${{ inputs.fedora_version }}
          variant: Kinoite
          iso_name: ${{ matrix.image }}.iso
          # Bazzite's NVIDIA and other kernel modules are signed with this key.
          secure_boot_key_url: https://github.com/ublue-os/akmods/raw/main/certs/public_key.der
          enrollment_password: universalblue

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-iso
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
