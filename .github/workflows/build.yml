name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  # Quality gate (P0 step 1). Images are only built when every check passes.
  # Runs on the same Fedora release the images are based on, so the tests use the real
  # Python and libraries. No secrets are available to this job.
  checks:
    name: Tests and security checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash   # bash -eo pipefail: a failing command in a pipe fails the step
    container:
      image: registry.fedoraproject.org/fedora:45
      options: --privileged   # cryptsetup tests make LUKS images on files
    steps:
      - name: Install test tools
        run: |
          dnf -y install git python3 python3-fastapi python3-uvicorn python3-httpx python3-pip \
            python3-pyyaml python3-requests cryptsetup gnupg2 ShellCheck bandit procps-ng util-linux \
            curl tar gzip
          # Pinned by hash: only this exact file is accepted.
          printf 'detect-secrets==1.5.0 --hash=sha256:e24e7b9b5a35048c313e983f76c4bd09dad89f045ff059e354f9943bf45aa060\n' > /tmp/req.txt
          pip install --no-deps --require-hashes -r /tmp/req.txt
          # actionlint (workflow checker): one exact release, accepted only with this sha256
          # (from the release's actionlint_1.7.12_checksums.txt).
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: Python security lint (fails on High findings)
        run: |
          mapfile -t files < <(grep -rlE '^#!.*python' files/system/usr/bin files/system/usr/libexec; find files -name '*.py')
          bandit -q -lll "${files[@]}"

      - name: Shell script checks
        run: |
          grep -rlE '^#!.*(bash|/sh)' files .github | xargs shellcheck -S warning

      - name: Workflow checks (actionlint, with shellcheck on every run script)
        run: actionlint .github/workflows/*.yml

      - name: Secret scan (fails on anything not reviewed in .secrets.baseline)
        run: |
          git config --global --add safe.directory "$PWD"
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  # The Bazzite images we build on must carry Universal Blue's signature
  # (their public key is kept in .github/keys).
  base-images:
    name: Verify base image signatures
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The Fedora major of the base image (for the version number) and the tag BlueBuild will give
    # this commit's images: <sha7>-candidate-<fedora>.
    outputs:
      fedora: ${{ steps.release.outputs.fedora }}
      built_tag: ${{ steps.release.outputs.built_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Verify
        run: |
          for img in ghcr.io/ublue-os/bazzite:stable ghcr.io/ublue-os/bazzite-nvidia-open:stable; do
            cosign verify --key .github/keys/ublue-os-bazzite.pub "$img" > /dev/null
            echo "verified: $img"
          done
      # Fedora major from the verified base image's version label.
      - name: Fedora version of the base image
        id: release
        run: |
          skopeo inspect --retry-times 3 --no-tags docker://ghcr.io/ublue-os/bazzite:stable > /tmp/base-inspect.json
          python3 .github/scripts/forge_release.py plan --inspect /tmp/base-inspect.json --github-output "$GITHUB_OUTPUT"

  # How images get their tags (BlueBuild v0.9.42, github_driver.rs generate_tags): the recipes set
  # alt-tags: [candidate], so BlueBuild never pushes "latest". It pushes and signs, in one step:
  # on main "candidate", "candidate-<fedora>", "<date>-candidate-<fedora>" and "<sha7>-candidate-<fedora>";
  # on other branches "br-<branch>-candidate-<fedora>" and "<sha7>-candidate-<fedora>". Right after the
  # push, this job reads the digest of "<sha7>-candidate-<fedora>", checks our signature and the Forge
  # version label on that digest, and hands the digest to the later jobs as an artifact of this run.
  # Only then does stable-tag (main) or channel-tag (testing) point "latest" or "testing" at it.
  # The job is serialized per commit and image, so a main and a testing run of the same commit can't
  # both push "<sha7>-candidate-<fedora>" between one's push and its digest read.
  bluebuild:
    name: Build Custom Image
    needs: [checks, base-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: forge-push-${{ github.sha }}-${{ matrix.recipe }}
      cancel-in-progress: false
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
          - recipe-universal.yml
    env:
      IMAGE: ghcr.io/monkey7770/${{ matrix.recipe == 'recipe.yml' && 'forge-os' || 'forge-os-universal' }}
    steps:
      # Our own checkout (the action's is skipped below), so the version file can be added first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The version is made here, not in an earlier job, so a re-run of this job (also "Re-run
      # failed jobs") gets its own version: 45.YYYYMMDD.<run number>[.<attempt>].
      - name: Forge OS version number
        id: release
        env:
          FEDORA: ${{ needs.base-images.outputs.fedora }}
        run: python3 .github/scripts/forge_release.py plan --fedora "$FEDORA" --github-output "$GITHUB_OUTPUT"

      # /usr/share/forge/version.json in the image (shown in Settings and the Dashboard), and
      # FORGE_VERSION for the image's own label org.forgeos.version (recipes, "labels").
      - name: Write the Forge OS version into the image
        env:
          FORGE_VERSION_JSON: ${{ steps.release.outputs.version_json }}
        run: python3 .github/scripts/forge_release.py write --out files/system/usr/share/forge/version.json --github-env "$GITHUB_ENV"

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81  # v1.13
        with:
          recipe: ${{ matrix.recipe }}
          skip_checkout: true   # checked out above, with the version file added
          cosign_private_key: ${{ secrets.COSKEY }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          # Check the BlueBuild tool's signature and build provenance before using it,
          # and use one exact release instead of whatever "v0.9" points at today.
          verify_install: true
          cli_version: v0.9.42

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

      # This run's image, by digest: our signature and this run's Forge version label, checked
      # before any channel tag points at it.
      - name: Check the image this run pushed
        if: github.event_name != 'pull_request'
        env:
          BUILT_TAG: ${{ needs.base-images.outputs.built_tag }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          skopeo inspect --retry-times 3 --no-tags --format '{{.Digest}}' "docker://$IMAGE:$BUILT_TAG" > /tmp/digest.txt
          DIGEST="$(python3 .github/scripts/forge_release.py read-digest /tmp/digest.txt)"
          cosign verify --key cosign.pub "$IMAGE@$DIGEST" > /dev/null
          skopeo inspect --retry-times 3 --no-tags "docker://$IMAGE@$DIGEST" > /tmp/pushed-inspect.json
          python3 .github/scripts/forge_release.py check-label --inspect /tmp/pushed-inspect.json --expect "$FORGE_VERSION"
          mkdir -p digest
          printf '%s\n' "$DIGEST" > digest/digest.txt
          echo "this run's image: $IMAGE@$DIGEST (Forge OS $FORGE_VERSION, signature checked)"

      - name: Hand the digest to the later jobs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: digest-${{ matrix.recipe == 'recipe.yml' && 'forge-os' || 'forge-os-universal' }}
          path: digest/
          if-no-files-found: error
          retention-days: 7

  # Stable channel: only a run of refs/heads/main moves "latest" (schedule, push or by hand alike),
  # to this run's checked digest.
  stable-tag:
    name: Tag stable image (${{ matrix.image }})
    needs: [bluebuild]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [forge-os, forge-os-universal]
    env:
      IMAGE: ghcr.io/monkey7770/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: digest-${{ matrix.image }}
          path: digest
      - name: Point the latest tag at this run's image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          DIGEST="$(python3 .github/scripts/forge_release.py read-digest digest/digest.txt)"
          cosign verify --key cosign.pub "$IMAGE@$DIGEST" > /dev/null
          skopeo copy --preserve-digests --multi-arch all --retry-times 3 "docker://$IMAGE@$DIGEST" "docker://$IMAGE:latest"
          cosign verify --key cosign.pub "$IMAGE:latest" > /dev/null
          echo "latest -> $DIGEST (signature checked)"

  # After publishing: check that what is on ghcr.io carries our signature. Only the
  # public key (cosign.pub in this repo) is used here.
  verify:
    name: Verify published signatures
    needs: [bluebuild, stable-tag]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [forge-os, forge-os-universal]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Verify signature
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign verify --key cosign.pub "ghcr.io/monkey7770/${{ matrix.image }}:latest" > /dev/null

  # Testing channel: only a run of refs/heads/testing moves "testing", to this run's checked digest.
  # Our signature is on the digest, so it covers the new tag too (checked again at the end).
  channel-tag:
    name: Tag testing image (${{ matrix.image }})
    needs: [bluebuild]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/testing'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [forge-os, forge-os-universal]
    env:
      IMAGE: ghcr.io/monkey7770/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: digest-${{ matrix.image }}
          path: digest
      - name: Point the testing tag at this run's image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          DIGEST="$(python3 .github/scripts/forge_release.py read-digest digest/digest.txt)"
          cosign verify --key cosign.pub "$IMAGE@$DIGEST" > /dev/null
          skopeo copy --preserve-digests --multi-arch all --retry-times 3 "docker://$IMAGE@$DIGEST" "docker://$IMAGE:testing"
          cosign verify --key cosign.pub "$IMAGE:testing" > /dev/null
          echo "testing -> $DIGEST (signature checked)"

  # SBOM (software bill of materials) for the image this run built: one pinned syft release,
  # kept as a workflow artifact, and attached to the image as an attestation signed keyless with
  # this workflow's GitHub identity (no key or secret involved). Never blocks the images above.
  sbom:
    name: SBOM (${{ matrix.image }})
    needs: [bluebuild]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # to store the attestation next to the image
      id-token: write   # keyless signing
    strategy:
      fail-fast: false
      matrix:
        image: [forge-os, forge-os-universal]
    env:
      IMAGE: ghcr.io/monkey7770/${{ matrix.image }}
      NAME: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Install syft (one exact release, accepted only with this sha256)
        run: |
          # sha256 from the release's syft_1.57.2_checksums.txt.
          curl -fsSL -o /tmp/syft.tar.gz https://github.com/anchore/syft/releases/download/v1.57.2/syft_1.57.2_linux_amd64.tar.gz
          echo "ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C /tmp syft
      - name: Free disk space (the image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: digest-${{ matrix.image }}
          path: digest
      - name: This run's image (signature checked)
        id: built
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          DIGEST="$(python3 .github/scripts/forge_release.py read-digest digest/digest.txt)"
          cosign verify --key cosign.pub "$IMAGE@$DIGEST" > /dev/null
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Make the SBOM (SPDX JSON)
        env:
          DIGEST: ${{ steps.built.outputs.digest }}
        run: |
          mkdir -p sbom
          /tmp/syft scan "registry:$IMAGE@$DIGEST" -o "spdx-json=sbom/$NAME.spdx.json"
          echo "$IMAGE@$DIGEST" > "sbom/$NAME.image.txt"
      - name: Upload the SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ matrix.image }}-sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 90
      # A refused attestation (for example the public log's size limit) only warns: the SBOM is
      # already kept as an artifact, and the run (and the screenshot test after it) goes on.
      - name: Attach the SBOM as a signed attestation (keyless)
        id: attest
        continue-on-error: true
        env:
          DIGEST: ${{ steps.built.outputs.digest }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          cosign attest --yes --type spdxjson --predicate "sbom/$NAME.spdx.json" "$IMAGE@$DIGEST"
          cosign verify-attestation --type spdxjson --certificate-identity "https://github.com/$WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$DIGEST" > /dev/null
          echo "SBOM attestation attached and verified for $IMAGE@$DIGEST"
      - name: Warn when the attestation was not attached
        if: steps.attest.outcome == 'failure'
        run: echo "::warning::The SBOM for $NAME could not be attached as an attestation. It is still in the $NAME-sbom artifact of this run."
