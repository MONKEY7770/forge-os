name: diag-verify
# Temporary, test branch only: reads the digest and source labels of the ISO builder image
# (jasonn3/build-container-installer v1.5.0) so it can be pinned. Read only, no secrets.
on:
  push:
    branches: [forge-test]
    paths: [".github/workflows/diag-verify.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Digest and labels
        run: |
          for t in v1.5.0 v1.5 v1; do
            echo "== $t"
            skopeo inspect --format '{{.Digest}} {{index .Labels "org.opencontainers.image.revision"}} {{index .Labels "org.opencontainers.image.version"}} {{.Created}}' \
              "docker://ghcr.io/jasonn3/build-container-installer:$t" || true
          done
