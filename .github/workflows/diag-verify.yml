name: diag-verify
# Temporary, test branch only: finds which step raises RecursionError on Fedora 45's Python, and which
# video encoders and file tools its packages offer. Read only, no secrets. Will be deleted after one run.
on:
  push:
    branches: [forge-test]
    paths: [".github/workflows/diag-verify.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45
    steps:
      - name: Tools
        run: dnf -y install git python3 python3-fastapi python3-uvicorn python3-httpx python3-pyyaml ffmpeg-free e2fsprogs > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Python and the deep input
        run: |
          python3 --version
          python3 - <<'EOF'
          import json, sys, traceback
          sys.path.insert(0, "files/system/usr/lib/forge")
          print("recursion limit", sys.getrecursionlimit())
          raw = "[" * 100000 + "]" * 100000
          for name, fn in [
              ("json.loads", lambda: json.loads(raw)),
              ("json.loads parse_constant", lambda: json.loads(raw, parse_constant=lambda c: None)),
          ]:
              try:
                  fn(); print(name, "ok")
              except RecursionError as e:
                  print(name, "RecursionError (caught by the code):", e)
          from policy import clean_details
          for name, fn in [("clean_details(str)", lambda: clean_details(raw)),
                           ("clean_details(str, 40000)", lambda: clean_details(raw + " -> x", 40_000))]:
              try:
                  fn(); print(name, "ok")
              except BaseException:
                  print(name, "FAILED"); traceback.print_exc(limit=-8)
          EOF
      - name: The agent test with a traceback
        run: |
          # Print the full traceback where the run records its error (this copy only, never committed).
          sed -i 's/^\(\s*\)status, result, error = "failed", None, f"{type(e).__name__}: {e}"/\1import traceback; traceback.print_exc(limit=-12)\n\1status, result, error = "failed", None, f"{type(e).__name__}: {e}"/' \
            files/system/usr/lib/forge/forgecore/agents.py
          grep -n "print_exc" files/system/usr/lib/forge/forgecore/agents.py
          python3 -m unittest tests.test_agents.RunHistoryRedactionRound2Test.test_deeply_nested_tool_args_do_not_fail_the_run 2>&1 | tail -40 || true
      - name: Encoders and chattr
        run: |
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E "264|265|mpeg4|vp8|vp9|av1|theora|gif|png" || true
          d=$(mktemp -d) && chattr +i "$d" && echo "chattr +i works" && chattr -i "$d" || echo "chattr +i does not work here"
