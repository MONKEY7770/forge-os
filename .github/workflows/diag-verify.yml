name: diag-verify
# Temporary, test branch only: shows what is attached to Bazzite's images and how each cosign
# version answers the key check. Read only, no secrets. Will be deleted after one run.
on:
  push:
    branches: [forge-test]
    paths: [".github/workflows/diag-verify.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Get cosign 2.6.5 and 3.1.3 (checked against the release checksums)
        run: |
          for v in v2.6.5 v3.1.3; do
            curl -fsSL -o "/tmp/cosign-$v" "https://github.com/sigstore/cosign/releases/download/$v/cosign-linux-amd64"
            curl -fsSL -o "/tmp/sums-$v" "https://github.com/sigstore/cosign/releases/download/$v/cosign_checksums.txt"
            (cd /tmp && grep " cosign-linux-amd64$" "sums-$v" | sed "s/cosign-linux-amd64/cosign-$v/" | sha256sum -c -)
            chmod +x "/tmp/cosign-$v"
          done
      - name: What is attached
        run: |
          for img in ghcr.io/ublue-os/bazzite:stable ghcr.io/ublue-os/bazzite-nvidia-open:stable; do
            echo "== $img"
            skopeo inspect --raw "docker://$img" | head -c 600; echo
            /tmp/cosign-v3.1.3 tree "$img" || true
          done
      - name: Key check with each version
        run: |
          for img in ghcr.io/ublue-os/bazzite:stable ghcr.io/ublue-os/bazzite-nvidia-open:stable; do
            for v in v2.6.5 v3.1.3; do
              echo "== $v $img"
              "/tmp/cosign-$v" version | grep GitVersion
              "/tmp/cosign-$v" verify --key .github/keys/ublue-os-bazzite.pub "$img" > /dev/null && echo "OK default" || echo "FAILED default"
            done
            echo "== v2.6.5 legacy only"
            /tmp/cosign-v2.6.5 verify --key .github/keys/ublue-os-bazzite.pub --new-bundle-format=false --experimental-oci11=false "$img" > /dev/null && echo "OK legacy" || echo "FAILED legacy"
          done
      - name: Key check without the transparency log (what the installed system's policy checks)
        run: |
          for img in ghcr.io/ublue-os/bazzite:stable ghcr.io/ublue-os/bazzite-nvidia-open:stable; do
            for v in v2.6.5 v3.1.3; do
              echo "== $v no-tlog $img"
              "/tmp/cosign-$v" verify --key .github/keys/ublue-os-bazzite.pub --insecure-ignore-tlog=true "$img" > /dev/null && echo "OK no-tlog" || echo "FAILED no-tlog"
            done
            echo "== wrong key must fail: $img"
            [ -f /tmp/wrong.pub ] || COSIGN_PASSWORD='' /tmp/cosign-v3.1.3 generate-key-pair --output-key-prefix /tmp/wrong > /dev/null 2>&1
            /tmp/cosign-v3.1.3 verify --key /tmp/wrong.pub --insecure-ignore-tlog=true "$img" > /dev/null && echo "WRONG KEY PASSED" || echo "wrong key refused, good"
          done
      - name: What the signature holds, and the keyless check pinned to Bazzite's workflow
        run: |
          for img in ghcr.io/ublue-os/bazzite:stable ghcr.io/ublue-os/bazzite-nvidia-open:stable; do
            echo "== download signature $img"
            /tmp/cosign-v2.6.5 download signature "$img" | python3 -c "
          import json, sys
          for line in sys.stdin:
              d = json.loads(line)
              print('has Cert:', bool(d.get('Cert')), 'has Bundle:', bool(d.get('Bundle')), 'keys:', sorted(d))
              if d.get('Cert'):
                  print(d['Cert'][:200])
          " || true
            echo "== keyless $img"
            /tmp/cosign-v2.6.5 verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github\.com/ublue-os/bazzite/\.github/workflows/' "$img" 2>&1 \
              | python3 -c "
          import json, sys
          data = sys.stdin.read()
          try:
              for e in json.loads(data):
                  o = e.get('optional') or {}
                  print('OK keyless', o.get('Subject'), o.get('Issuer'), o.get('githubWorkflowRef') or o.get('1.3.6.1.4.1.57264.1.6'))
          except Exception:
              print(data[-400:])
          "
          done
      - name: Tight identity, and wrong identities must fail
        run: |
          for img in ghcr.io/ublue-os/bazzite:stable ghcr.io/ublue-os/bazzite-nvidia-open:stable; do
            for re in '^https://github\.com/ublue-os/bazzite/\.github/workflows/build\.yml@refs/heads/main$' \
                      '^https://github\.com/ublue-os/aurora/' '^https://github\.com/ublue-os/bazzite/\.github/workflows/nope\.yml@'; do
              if /tmp/cosign-v3.1.3 verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                   --certificate-identity-regexp "$re" "$img" > /tmp/out.json 2>/tmp/err.txt; then
                echo "PASS  $re  $img"
              else
                echo "FAIL  $re  $img: $(tail -c 160 /tmp/err.txt)"
              fi
            done
          done
          /tmp/cosign-v3.1.3 verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/ublue-os/bazzite/' ghcr.io/ublue-os/bazzite:stable 2>&1 \
            | grep -iE "identity|subject|workflow|issuer" | head -5 || true
