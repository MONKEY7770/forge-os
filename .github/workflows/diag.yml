name: diag
# Temporary, test branch only: do the pinned Krema and Wallpaper Engine builds install into the image
# (dry run, signatures checked against the pinned keys), and the video plugin's config keys. No secrets.
on:
  push:
    branches: [forge-test]
    paths: [.github/workflows/diag.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Dry-run installs in the image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker run --rm --entrypoint bash ghcr.io/monkey7770/forge-os-universal:br-forge-test-candidate-45 -c '
            set +e
            K=https://download.copr.fedorainfracloud.org/results/isac322/krema
            W=https://download.copr.fedorainfracloud.org/results/captsilver666/wallpaper-engine-kde-plugin
            curl -fsSL $K/pubkey.gpg -o /tmp/krema.gpg; curl -fsSL $W/pubkey.gpg -o /tmp/we.gpg
            gpg --batch --with-colons --show-keys /tmp/krema.gpg /tmp/we.gpg | grep ^fpr
            echo "== krema"
            dnf5 -y --assumeno --repofrompath=k,$K/fedora-45-x86_64/ --setopt=k.gpgkey=file:///tmp/krema.gpg --setopt=k.gpgcheck=1 install krema-0.13.0-1.fc45 2>&1 | tail -25
            echo "== wallpaper engine"
            dnf5 -y --assumeno --repofrompath=w,$W/fedora-45-x86_64/ --setopt=w.gpgkey=file:///tmp/we.gpg --setopt=w.gpgcheck=1 install "wallpaper-engine-kde-plugin-qt6-1.5^20261108.192.g8173e09-1.fc45" 2>&1 | tail -25
            echo "== video plugin keys"
            grep -rn "dayNightCycleAssignment\|VideoUrls\|videoUrls" /usr/share/plasma/wallpapers/ 2>/dev/null | head -20
            grep -rn "dayNightPhase" /usr/share/plasma/wallpapers/ 2>/dev/null | grep -iE "json|parse|stringify|url" | head -10
          '
