name: diag
# Temporary, test branch only: is the first-boot account wizard in the image? Read only, no secrets.
on:
  push:
    branches: [forge-test]
    paths: [.github/workflows/diag.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Inspect the image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker run --rm --entrypoint bash ghcr.io/monkey7770/forge-os-universal:br-forge-test-candidate-45 -c '
            set +e
            echo "== packages"; rpm -q plasma-setup plasma-login-manager sddm initial-setup gnome-initial-setup
            echo "== display manager"; readlink /etc/systemd/system/display-manager.service
            echo "== setup units"; ls /usr/lib/systemd/system /etc/systemd/system | grep -iE "setup|plasma|login|sddm|oem|firstboot|first-boot"
            for u in plasma-setup.service plasmalogin.service sddm.service; do echo "$u: $(systemctl is-enabled $u 2>&1)"; done
            echo "== plasma-setup files"; rpm -ql plasma-setup 2>/dev/null | grep -vE "/locale/|\.qml$|/icons/" | head -40
            echo "== presets"; grep -rhiE "setup|plasma|login|sddm" /usr/lib/systemd/system-preset /etc/systemd/system-preset 2>/dev/null
            echo "== login config"; cat /etc/plasmalogin.conf 2>/dev/null; ls -la /etc/plasmalogin.conf.d /usr/lib/plasmalogin.conf.d 2>/dev/null; cat /etc/plasmalogin.conf.d/* /usr/lib/plasmalogin.conf.d/* 2>/dev/null
            echo "== users from uid 1000"; awk -F: "\$3>=1000 && \$3<65000" /etc/passwd /usr/lib/passwd 2>/dev/null
            echo "== bazzite first boot"; ls /usr/libexec | grep -iE "bazzite|setup|firstboot|oobe" | head; ls /usr/share/ublue-os 2>/dev/null | head
          '
