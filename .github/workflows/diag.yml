name: diag
# Temporary, test branch only: how Plasma Setup loads pages, its user and units. No secrets.
on:
  push:
    branches: [forge-test]
    paths: [.github/workflows/diag.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Inspect plasma-setup
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker run --rm --entrypoint bash ghcr.io/monkey7770/forge-os-universal:br-forge-test-candidate-45 -c '
            set +e
            rpm -ql plasma-setup | grep -v "/locale/\|/doc/\|/icons/"
            echo "== sysusers"; cat /usr/lib/sysusers.d/*plasma-setup* 2>/dev/null
            echo "== units"; for u in $(rpm -ql plasma-setup | grep "\.service$\|\.target$"); do echo "--- $u"; cat "$u"; done
            echo "== qml module"; for f in $(rpm -ql plasma-setup | grep -E "qmldir$|SetupModule|\.qmltypes$"); do echo "--- $f"; cat "$f" | head -80; done
            echo "== wifi page"; for f in $(rpm -ql plasma-setup | grep -E "wifi.*(main\.qml|metadata\.json)$"); do echo "--- $f"; cat "$f"; done
            echo "== account page"; for f in $(rpm -ql plasma-setup | grep -E "account.*main\.qml$"); do echo "--- $f"; head -120 "$f"; done
            echo "== strings"; b=$(rpm -ql plasma-setup | grep -E "/bin/plasma-setup$"); strings "$b" | grep -iE "KDE/PlasmaSetup|nextRequested|X-KDE-Weight|kpackage|\.qml" | sort -u | head -40
            echo "== libs"; for l in $(rpm -ql plasma-setup | grep "\.so"); do strings "$l" | grep -iE "nextRequested|KDE/PlasmaSetup|SetupModule|function|Weight" | sort -u | head -30; done
          '
