name: diag
# Temporary, test branch only (installs a QML runner inside the throwaway container): checks the new image (fonts, desktop keys, the wizard page with the
# real Plasma Setup modules). No secrets.
on:
  push:
    branches: [forge-test]
    paths: [.github/workflows/diag.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Inspect the image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker run --rm --entrypoint bash ghcr.io/monkey7770/forge-os-universal:br-forge-test-candidate-45 -c '
            set +e
            echo "== thai fallback order"; fc-match -s "IBM Plex Sans:lang=th" | head -4
            echo "== kcm lock"; grep -n "Restrictions\|kcm_updates" /etc/xdg/kdeglobals
            dnf5 -q -y install qt6-qtdeclarative-devel >/dev/null 2>&1; echo "install rc=$?"
            Q=$(ls /usr/lib64/qt6/bin/qml /usr/bin/qml6 /usr/bin/qml 2>/dev/null | head -1); echo "qml=$Q"
            mkdir -p /tmp/t && cat > /tmp/t/load.qml <<QML
          import QtQuick
          Item {
              Component.onCompleted: {
                  var c = Qt.createComponent("file:///usr/share/plasma/packages/org.forgeos.setup.aistorage/contents/ui/main.qml")
                  console.warn("FORGE status", c.status, "errors:", c.errorString())
                  if (c.status === Component.Ready) {
                      var o = c.createObject(null)
                      console.warn("FORGE created", o !== null, o ? o.contentItem : "none", o ? o.cardWidth : "")
                  }
                  Qt.quit()
              }
          }
          QML
            QT_QPA_PLATFORM=offscreen QT_LOGGING_RULES="*.debug=true;qt.*.debug=false" timeout 60 "$Q" /tmp/t/load.qml > /tmp/t/out 2>&1; echo "rc=$?"; grep -v "^qt\.\|propagateSizeHints" /tmp/t/out | head -30
            echo "== built-in page loads the same way (control)"
            sed -i "s#org.forgeos.setup.aistorage#org.kde.plasmasetup.hostname#" /tmp/t/load.qml
            QT_QPA_PLATFORM=offscreen QT_LOGGING_RULES="*.debug=true;qt.*.debug=false" timeout 60 "$Q" /tmp/t/load.qml > /tmp/t/out 2>&1; echo "rc=$?"; grep -v "^qt\.\|propagateSizeHints" /tmp/t/out | head -10
          '
