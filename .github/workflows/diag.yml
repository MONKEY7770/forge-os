name: diag
# Temporary, test branch only: how the Flatpak installer decides what to install, and what Bazzite
# ships for Android, virtual machines and retro gaming. No secrets.
on:
  push:
    branches: [forge-test]
    paths: [.github/workflows/diag.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Inspect the image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker run --rm --entrypoint bash ghcr.io/monkey7770/forge-os-universal:br-forge-test-candidate-45 -c '
            set +e
            for f in /usr/libexec/bluebuild/default-flatpaks/system-flatpak-setup /usr/libexec/bazzite-flatpak-manager; do echo "=== $f"; cat "$f"; done
            echo "=== config"; head -60 /usr/share/bluebuild/default-flatpaks/configuration.yaml
            for f in 82-bazzite-waydroid 86-bazzite-windows 82-bazzite-apps; do echo "=== $f"; cat /usr/share/ublue-os/just/$f.just; done
            echo "=== virt"; head -150 /usr/share/ublue-os/just/84-bazzite-virt.just
          '
