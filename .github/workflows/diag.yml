name: diag
# Temporary, test branch only: do the IBM Plex font packages exist for this image (dry run)? No secrets.
on:
  push:
    branches: [forge-test]
    paths: [.github/workflows/diag.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Dry-run font install
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker run --rm --entrypoint bash ghcr.io/monkey7770/forge-os-universal:br-forge-test-candidate-45 -c '
            set +e
            dnf5 -q repoquery --available "ibm-plex*" 2>&1 | sort -u | head -40
            echo "== dry run"
            dnf5 -y --assumeno install ibm-plex-sans-fonts ibm-plex-sans-thai-fonts ibm-plex-mono-fonts 2>&1 | tail -15
            echo "== installed now"; rpm -qa | grep -i plex
            echo "== kdeglobals"; cat /etc/xdg/kdeglobals
          '
