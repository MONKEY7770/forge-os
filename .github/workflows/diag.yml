name: diag
# Temporary, test branch only: checks the new image (fonts, desktop keys, the wizard page with the
# real Plasma Setup modules). No secrets.
on:
  push:
    branches: [forge-test]
    paths: [.github/workflows/diag.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Inspect the image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker run --rm --entrypoint bash ghcr.io/monkey7770/forge-os-universal:br-forge-test-candidate-45 -c '
            set +e
            echo "== fonts"; rpm -q ibm-plex-sans-fonts ibm-plex-sans-thai-fonts ibm-plex-mono-fonts
            fc-match "IBM Plex Sans"; fc-match "IBM Plex Sans:lang=th"; fc-match "IBM Plex Mono"
            echo "== kdeglobals"; cat /etc/xdg/kdeglobals; echo "== kwinrc"; grep -A3 "Plugins" /etc/xdg/kwinrc
            echo "== schemes"; ls /usr/share/color-schemes/ | grep -i forge
            echo "== guard"; ls -l /usr/libexec/forge-model-guard; systemctl is-enabled forge-model-guard.timer forge-setup-storage.path
            echo "== flatpaks"; grep -rl PrismLauncher /usr/share/bluebuild 2>/dev/null | head -3
            echo "== page"; ls -R /usr/share/plasma/packages/org.forgeos.setup.aistorage
            Q=$(ls /usr/lib64/qt6/bin/qml 2>/dev/null || command -v qml6 || command -v qml); echo "qml=$Q"
            mkdir -p /tmp/t && cat > /tmp/t/load.qml <<QML
          import QtQuick
          Item {
              Component.onCompleted: {
                  var c = Qt.createComponent("file:///usr/share/plasma/packages/org.forgeos.setup.aistorage/contents/ui/main.qml")
                  console.log("FORGE status", c.status, "errors:", c.errorString())
                  if (c.status === Component.Ready) {
                      var o = c.createObject(null)
                      console.log("FORGE created", o !== null, o ? o.contentItem : "none", o ? o.cardWidth : "")
                  }
                  Qt.quit()
              }
          }
          QML
            QT_QPA_PLATFORM=offscreen timeout 60 "$Q" /tmp/t/load.qml 2>&1 | grep -v "^qt\.\|propagateSizeHints" | head -30
            echo "== built-in page loads the same way (control)"
            sed -i "s#org.forgeos.setup.aistorage#org.kde.plasmasetup.hostname#" /tmp/t/load.qml
            QT_QPA_PLATFORM=offscreen timeout 60 "$Q" /tmp/t/load.qml 2>&1 | grep -v "^qt\.\|propagateSizeHints" | head -10
          '
