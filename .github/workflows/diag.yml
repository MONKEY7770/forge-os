name: diag
# Temporary: how the UEFI boot image sits in the ISO (test branch only, removed afterwards).
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: forge-os-universal-iso
          path: iso
          run-id: 45053921349
          github-token: ${{ github.token }}
      - name: Report
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xorriso mtools fdisk > /dev/null
          ISO=iso/forge-os-universal.iso
          xorriso -indev "$ISO" -report_el_torito plain 2>&1
          xorriso -indev "$ISO" -report_el_torito as_mkisofs 2>&1
          xorriso -indev "$ISO" -report_system_area plain 2>&1
          sfdisk -l "$ISO" || true
          xorriso -indev "$ISO" -find / -maxdepth 2 2>&1 | head -40
          xorriso -indev "$ISO" -find /images /EFI -type f 2>&1 | head -40
          xorriso -indev "$ISO" -find / -name 'grub.cfg' 2>&1
