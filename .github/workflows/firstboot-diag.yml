name: firstboot-diag
# Temporary, test branch only: the first-boot wizard test (a copy of screenshot-test's firstboot job)
# for this branch's image, since workflows can be started by hand only from the default branch.
on:
  push:
    branches: [forge-test]
    paths: [.github/workflows/firstboot-diag.yml]
jobs:
  firstboot:
    name: First boot wizard (forge-os-universal)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/monkey7770/forge-os-universal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # By hand with image_tag: that tag, only if it is one our build makes (the iso-tag check of
      # forge_release.py). Otherwise the same choice as the screenshots job.
      - name: Which image to test
        id: pick
        env:
          EVENT: workflow_dispatch
          CHANNEL_INPUT: stable
          IMAGE_TAG_INPUT: br-forge-test-candidate-45
          RUN_BRANCH: ""
        run: python3 .github/scripts/forge_screenshot.py firstboot-tag >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Only an image that carries our signature is tested, and from here on only by its digest.
      - name: Check the image signature
        id: image
        env:
          TAG: ${{ steps.pick.outputs.tag }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign verify --key cosign.pub "$IMAGE:$TAG" > /tmp/verify.json
          DIGEST="$(python3 .github/scripts/forge_release.py digest < /tmp/verify.json)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Testing $IMAGE:$TAG = $DIGEST (signature checked)"

      - name: Free disk space (image, test image and disk are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "No KVM on this runner: the test runs slower, with a longer limit."

      # Test-only addition: the probe. No account, no automatic login. Never pushed.
      - name: Build the first-boot test image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          sudo podman build --pull=always --build-arg "BASE=$IMAGE@$DIGEST" \
            -t localhost/forge-firstboot-test:latest -f .github/screenshot/firstboot/Containerfile .github/screenshot/firstboot

      - name: Install it to a virtual disk (the image's own bootc)
        run: python3 .github/scripts/forge_screenshot.py install --image localhost/forge-firstboot-test:latest --work work

      - name: Boot it and wait for the first account wizard
        run: python3 .github/scripts/forge_screenshot.py firstboot --disk work/disk.raw --out firstboot

      # result.txt holds only text made on the runner (fixed words and checked numbers).
      - name: Summary
        if: ${{ always() }}
        run: |
          if [ -f firstboot/result.txt ]; then
            { echo '### First boot wizard'; echo '```'; cat firstboot/result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the screenshots and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: firstboot
          path: firstboot/
          if-no-files-found: warn
          retention-days: 14
