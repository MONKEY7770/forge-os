name: screenshot-test
# Screenshots of a built Forge OS image in a virtual machine: the boot splash, the Plasma desktop
# of a test account that logs in by itself, and Forge Settings. Plus one check: the desktop must
# appear within 20 minutes (60 without KVM) and Forge Settings must start.
# Runs after every successful bluebuild run from main or testing, or by hand (Actions tab,
# "screenshot-test", "Run workflow"). It is a separate workflow, so it never blocks a release.
# Tests forge-os-universal (made for virtual machines). Results: the "screenshots" artifact.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel's image to test"
        type: choice
        options:
          - stable
          - testing
        default: stable
  workflow_run:
    workflows: [bluebuild]
    types: [completed]

jobs:
  screenshots:
    name: Screenshots (forge-os-universal)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'testing'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/monkey7770/forge-os-universal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Which image to test
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          CHANNEL_INPUT: ${{ inputs.channel }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: python3 .github/scripts/forge_screenshot.py pick-tag >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Only an image that carries our signature is tested, and from here on only by its digest.
      - name: Check the image signature
        id: image
        env:
          TAG: ${{ steps.pick.outputs.tag }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          # Works for a private package too (the workflow's own read-only token).
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign verify --key cosign.pub "$IMAGE:$TAG" > /tmp/verify.json
          echo "digest=$(python3 .github/scripts/forge_release.py digest < /tmp/verify.json)" >> "$GITHUB_OUTPUT"

      - name: Free disk space (image, test image and disk are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          # Let QEMU use hardware acceleration (GitHub's documented udev rule).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "No KVM on this runner: the test runs slower, with a longer limit."

      # Test-only additions (test account with automatic login, Firefox, the probe). Never pushed.
      - name: Build the test image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | sudo podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          sudo podman build --pull=always --build-arg "BASE=$IMAGE@$DIGEST" \
            -t localhost/forge-screenshot-test:latest -f .github/screenshot/Containerfile .github/screenshot

      - name: Install it to a virtual disk (the image's own bootc)
        run: python3 .github/scripts/forge_screenshot.py install --image localhost/forge-screenshot-test:latest --work work

      - name: Boot it and take screenshots
        run: python3 .github/scripts/forge_screenshot.py boot --disk work/disk.raw --out screenshots

      - name: Upload the screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
