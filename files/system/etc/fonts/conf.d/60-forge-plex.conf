<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Forge OS: Thai text in IBM Plex Sans is drawn with IBM Plex Sans Thai, the matching design. -->
<fontconfig>
  <alias binding="same">
    <family>IBM Plex Sans</family>
    <accept>
      <family>IBM Plex Sans Thai</family>
    </accept>
  </alias>
</fontconfig>
