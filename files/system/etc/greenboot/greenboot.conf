# greenboot settings for Forge OS (automatic rollback after a failed update).
# Turn automatic rollback on or off in Forge Settings (System, Updates and recovery), not here.
# Forge's own check: /usr/libexec/forge-boot-health.

## Failed starts of a new system version before it goes back to the previous version.
GREENBOOT_MAX_BOOT_ATTEMPTS=3

## The repository DNS check fails on every start without internet, which does not mean the
## new system version is broken, so it is skipped.
DISABLED_HEALTHCHECKS=("01_repository_dns_check.sh")

## Hardware watchdog check: off (as in greenboot's default).
GREENBOOT_WATCHDOG_CHECK_ENABLED=false
