# Forge OS: run the first-boot wizard while there is no regular account, not only while
# /etc/plasma-setup-done is missing (see /usr/libexec/forge-first-user).
[Unit]
ConditionPathExists=

[Service]
ExecCondition=/usr/libexec/forge-first-user check
# The wizard's launcher checks that file too. With no account (checked above) it is stale: a
# failed account creation still wrote it, so remove it and let the wizard come back.
ExecStartPre=/usr/bin/rm -f /etc/plasma-setup-done
