# Forge OS: the first-boot app install (BlueBuild default-flatpaks) runs once, 30 seconds after boot.
# Offline, or on Wi-Fi that is only joined in the setup wizard, it fails; try again every 3 minutes
# for about an hour instead of waiting for the next boot. Every step of it is safe to repeat. After
# that (for example an app removed from Flathub, or a full disk) it waits for the next boot.
[Unit]
StartLimitIntervalSec=2h
StartLimitBurst=20

[Service]
Restart=on-failure
RestartSec=3min
