# Activity timeline: each administrator's forge-activity-publish writes <uid>.jsonl here.
# Owner forge: Forge Core can list it and read the 0644 files. Group wheel: only administrators
# can create files. Setgid keeps new files in wheel, sticky stops users replacing each other's
# files, and others can't enter, so non-administrators can't read anything here.
d /var/lib/forge-activity 3770 forge wheel -
# Public, values-free settings change list written by forge-apply (root). Readable by everyone.
d /var/lib/forge-timeline 0755 root root -
