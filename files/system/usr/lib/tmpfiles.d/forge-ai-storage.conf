# AI model storage limit: forge-model-guard (root) writes its state and the disk size here,
# readable by everyone (no secrets).
d /run/forge 0755 root root -
# Gaming mode's AI choice (forge-mode-apply, root): Ollama paused, or its CPU-only setting.
d /run/forge/gaming 0755 root root -
# The first-boot wizard (it runs as the plasma-setup user) saves its AI model storage choice here.
# Only that user and root can enter. forge-setup-storage.service checks the file and removes it.
d /var/lib/forge-setup 0700 plasma-setup plasma-setup -
# Built-in apps hidden in Forge Settings, Apps (forge-apps): made at boot, so menus watch it from the start.
d /var/usrlocal/share/applications 0755 root root -
