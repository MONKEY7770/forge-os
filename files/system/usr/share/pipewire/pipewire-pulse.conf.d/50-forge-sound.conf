# Forge OS: inside a virtual machine, give apps that use the PulseAudio interface (most of them,
# including notification sounds) a larger minimum buffer, so emulated sound cards do not crackle.
# Real hardware is not changed.
pulse.properties.rules = [
    {   matches = [ { cpu.vm.name = !null } ]
        actions = {
            update-props = {
                pulse.min.quantum = 2048/48000
            }
        }
    }
]
