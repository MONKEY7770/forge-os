# Forge OS: calm, on-time notification sounds.
# Notification sounds ask PipeWire for a very large buffer, which makes them late and the buffer
# does not shrink again afterwards (PipeWire issue 1908): cap the largest buffer at 2048 frames
# (about 43 ms at 48 kHz). Real hardware keeps PipeWire's low-latency minimum.
context.properties = {
    default.clock.max-quantum = 2048
}

# Inside a virtual machine, emulated sound cards crackle and distort with small buffers: use a
# 2048-frame minimum there only.
context.properties.rules = [
    {   matches = [ { cpu.vm.name = !null } ]
        actions = {
            update-props = {
                default.clock.min-quantum = 2048
            }
        }
    }
]
