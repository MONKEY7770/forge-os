# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Forge OS for PCs and laptops with an NVIDIA GPU (GTX 16 series and newer, RTX 50 included).
version: 1
name: forge-os
description: Forge OS (NVIDIA). Bazzite KDE with AI agents, remote access, Roblox and creative apps preinstalled.

# RTX 50 series cards only work with the NVIDIA open driver, so this base is required.
base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: stable

# Forge OS version (45.YYYYMMDD.N, set by CI in FORGE_VERSION) and commit, in Forge's own labels.
# Bazzite's org.opencontainers.image.version stays as it is. CI checks the label before any channel tag.
labels:
  org.forgeos.version: "${FORGE_VERSION}"
  org.forgeos.commit: "${GITHUB_SHA}"

# BlueBuild pushes only "candidate" tags (never "latest"); CI checks the image, then points "latest"
# (main) or "testing" (testing branch) at its digest. See .github/workflows/build.yml.
alt-tags:
  - candidate

modules:
  - from-file: common-modules.yml
