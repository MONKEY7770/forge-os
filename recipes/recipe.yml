# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Forge OS for PCs and laptops with an NVIDIA GPU (GTX 16 series and newer, RTX 50 included).
version: 1
name: forge-os
description: Forge OS (NVIDIA). Bazzite KDE with AI agents, remote access, Roblox and creative apps preinstalled.

# RTX 50 series cards only work with the NVIDIA open driver, so this base is required.
base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: stable

modules:
  - from-file: common-modules.yml
